openapi: 3.0.3
info:
  title: A-Share Multi-Stock Spike Radar API
  version: 1.0.0
  description: Personal single-user self-hosted radar. HIGH refers to attention priority, never buy recommendation.
servers:
  - url: http://127.0.0.1:8765/api/v1
paths:
  /health/live:
    get:
      operationId: getLiveness
      responses:
        '200': {description: Service process live, not equivalent to market-feed readiness, content: {application/json: {schema: {type: object, properties: {up: {type: boolean}}}}}}
  /health/ready:
    get:
      operationId: getReadiness
      responses:
        '200': {description: Readiness projection, content: {application/json: {schema: {$ref: '#/components/schemas/FeedHealth'}}}}
        '503': {description: Stopped market feed or unsafe system time, content: {application/json: {schema: {$ref: '#/components/schemas/FeedHealth'}}}}
  /radar:
    get:
      operationId: getRadar
      responses:
        '200':
          description: Live status and up to top 3 cards
          content:
            application/json:
              schema:
                type: object
                required: [feed, monitored_count, available_count, today_episode_count, top_cards]
                properties:
                  feed: {$ref: '#/components/schemas/FeedHealth'}
                  monitored_count: {type: integer, minimum: 0}
                  available_count: {type: integer, minimum: 0}
                  today_episode_count: {type: integer, minimum: 0}
                  top_cards: {type: array, maxItems: 3, items: {$ref: '#/components/schemas/SpikeCard'}}
  /watchlist:
    get:
      operationId: getWatchlist
      responses:
        '200': {description: Monitored symbols, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/WatchItem'}}}}}
    post:
      operationId: addWatchlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbols]
              properties:
                symbols: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {type: string, pattern: '^(SH|SZ)\.[0-9]{6}$'}}
      responses:
        '200': {description: Per-symbol accepted/rejected responses, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {type: object, properties: {symbol: {type: string}, status: {enum: [ADDED, ALREADY_EXISTS, REJECTED]}, reason: {type: string}}}}}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
  /watchlist/{symbol}:
    delete:
      operationId: removeWatchlistItem
      parameters:
        - in: path
          name: symbol
          required: true
          schema: {type: string}
      responses:
        '204': {description: Deleted or already absent; episodes retained}
  /episodes:
    get:
      operationId: listEpisodes
      parameters:
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 30}}
        - {in: query, name: cursor, schema: {type: string}}
      responses:
        '200': {description: Paginated event list, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/SpikeCard'}}, next_cursor: {type: string, nullable: true}}}}}}
  /episodes/{episode_id}:
    get:
      operationId: getEpisode
      parameters: [{in: path, name: episode_id, required: true, schema: {type: string}}]
      responses:
        '200': {description: Episode snapshot and audit events, content: {application/json: {schema: {type: object, properties: {card: {$ref: '#/components/schemas/SpikeCard'}, history: {type: array, items: {type: object}}}}}}}
        '404': {description: Unknown episode}
  /settings:
    get:
      operationId: getSettings
      responses:
        '200': {description: Single-user settings, content: {application/json: {schema: {$ref: '#/components/schemas/Settings'}}}}
    patch:
      operationId: updateSettings
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Settings'}}}
      responses:
        '200': {description: Applied with audit revision, content: {application/json: {schema: {$ref: '#/components/schemas/Settings'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
  /events/stream:
    get:
      operationId: streamEvents
      parameters:
        - {in: header, name: Last-Event-ID, schema: {type: string}}
      responses:
        '200':
          description: SSE; `id:` monotonically ascending. Replay must set delivery_mode=REPLAY.
          content:
            text/event-stream:
              schema: {type: string}
  /diagnostics:
    get:
      operationId: getDiagnostics
      responses:
        '200': {description: Per-symbol data coverage, provider latency and rejection reasons, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
components:
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code: {type: string}
              message: {type: string}
  schemas:
    FeedHealth:
      type: object
      required: [status, session, updated_at, available_count, monitored_count]
      properties:
        status: {enum: [HEALTHY, DEGRADED, STOPPED]}
        session: {enum: [CONTINUOUS, OPEN_AUCTION, MIDDAY_BREAK, CLOSE_AUCTION, CLOSED, UNKNOWN]}
        updated_at: {type: string, format: date-time}
        last_bar_end_at: {type: string, nullable: true, format: date-time}
        available_count: {type: integer, minimum: 0}
        monitored_count: {type: integer, minimum: 0}
        reasons: {type: array, items: {type: string}}
    SpikeCard:
      type: object
      required: [episode_id, symbol, priority, episode_state, score, last_bar_end_at, action, data_mode]
      properties:
        episode_id: {type: string}
        symbol: {type: string}
        priority: {enum: [HIGH, MEDIUM, LOW]}
        episode_state: {enum: [NEW, ACTIVE, STRENGTHENING, WEAKENING, EXPIRED, INVALIDATED]}
        score: {type: integer, minimum: 0, maximum: 90}
        last_bar_end_at: {type: string, format: date-time}
        action: {enum: [VIEW_NOW, MONITOR, IGNORE]}
        data_mode: {enum: [LIVE, SIMULATION]}
        reasons: {type: array, items: {type: string}}
    WatchItem:
      type: object
      required: [symbol, enabled]
      properties:
        symbol: {type: string}
        name: {type: string}
        enabled: {type: boolean}
        source_state: {type: string}
    Settings:
      type: object
      properties:
        quiet_mode: {type: boolean}
        notification_enabled: {type: boolean}
        max_watchlist: {type: integer, minimum: 1, maximum: 100}
